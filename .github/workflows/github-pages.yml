name: 发布活动作品集到 GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 获取代码
        uses: actions/checkout@v6
      - name: 设置 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: 读取 Pages 配置
        id: pages
        uses: actions/configure-pages@v5
      - name: 安装依赖
        run: npm ci
      - name: 构建静态网站
        run: npm run build:github-pages
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - name: 上传网站
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布网站
        id: deployment
        uses: actions/deploy-pages@v4
